<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>함께 항의하기</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --line:#e2e5ea; --fg:#1c1f24; --dim:#6b7280; --acc:#1a6dff; --acc2:#0f4fc4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:8px 0; }
  .lead { color:var(--dim); font-size:.92rem; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
  label { display:block; font-size:.85rem; font-weight:700; margin-bottom:6px; }
  input[type=text], textarea { width:100%; padding:11px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--fg); }
  input:focus, textarea:focus { outline:2px solid var(--acc); outline-offset:1px; }
  textarea { min-height:70px; resize:vertical; }
  .hint { font-size:.78rem; color:var(--dim); margin-top:5px; }
  .big { width:100%; padding:14px; font-size:1.05rem; font-weight:800; border:0; border-radius:10px; background:var(--acc); color:#fff; cursor:pointer; margin-top:8px; }
  .big:focus-visible { outline:3px solid var(--acc2); outline-offset:2px; }
  .hidden { display:none; }
  .dest { display:flex; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid var(--line); }
  .dest:last-child { border-bottom:0; }
  .dinfo { flex:1; min-width:0; }
  .dname { font-weight:700; font-size:.98rem; }
  .dmail { font-size:.78rem; color:var(--dim); word-break:break-all; }
  .send { padding:10px 16px; font-size:.9rem; font-weight:700; border:0; border-radius:8px; background:var(--acc); color:#fff; cursor:pointer; white-space:nowrap; }
  .send:focus-visible { outline:3px solid var(--acc2); outline-offset:2px; }
  .done { background:#12b76a; }
  .tips { font-size:.82rem; color:var(--dim); background:#eef4ff; border-radius:10px; padding:12px 14px; margin-top:16px; }
  .tips b { color:var(--fg); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1c1f24; color:#fff; padding:10px 20px; border-radius:24px; font-size:.85rem; transition:opacity .3s; }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
  .greet { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; }
  .edit { background:none; border:0; color:var(--acc); font:inherit; font-weight:700; cursor:pointer; padding:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>함께 항의해 주세요</h1>
  <div class="lead">이름과 한마디를 남겨주시면, 각 기관으로 보내는 메일을 준비해드립니다.</div>

  <div id="step1" class="card">
    <label for="name">이름 또는 닉네임</label>
    <input type="text" id="name" placeholder="예: 홍길동" autocomplete="name">
    <div style="height:14px"></div>
    <label for="msg">보내실 한마디</label>
    <textarea id="msg" placeholder="직접 쓰신 문장일수록 메일이 더 힘을 가집니다."></textarea>
    <div class="hint">무작위로 문구를 다듬어 기관마다 조금씩 다르게 담습니다.</div>
    <button class="big" id="go">참여하겠습니다</button>
  </div>

  <div id="step2" class="hidden">
    <div class="card">
      <div class="greet"><span><b id="hello"></b>님, 감사합니다.</span><button class="edit" id="back">수정</button></div>
    </div>
    <div class="card" id="destlist">
      <label style="margin-bottom:10px">보내실 기관을 선택해 메일을 보내주세요 <span style="color:var(--dim);font-weight:400">(여러 곳이면 각각 눌러주세요)</span></label>
      <!-- 수신처 목록: 실제 배포 시 기관명/주소 교체 -->
    </div>
    <div class="tips">
      <b>더 큰 힘이 되는 방법</b><br>
      · 메일 앱이 열리면 본문 끝에 <b>자기 경험 한 줄</b>을 직접 추가해 주세요<br>
      · 한 번에 몰아서 보내기보다 <b>며칠에 걸쳐 나눠</b> 보내면 잘림 없이 전달됩니다<br>
      · 발송 전 받는 사람이 올바른지 한 번 확인해 주세요
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ── 설정: 실제 배포 시 이 부분만 교체 ─────────────────────── */
var DESTS = [
  { name: "예시 기관 A", email: "contact-a@example.org" },
  { name: "예시 기관 B", email: "contact-b@example.org" },
  { name: "예시 기관 C", email: "contact-c@example.org" }
];

/* 제목 변형 풀 — {name},{msg} 자리표시자 */
var SUBJ_POOL = [
  "[항의] {msg-s}",
  "{name}입니다 — 강한 항의의 뜻을 전합니다",
  "이 사안에 대해 항의합니다",
  "[민원·항의] {msg-s}",
  "{name} 님의 항의 메일입니다"
];

/* 인사마다 다른 본문 프레임 — 실제 배포 시 항의 내용 채워넣기 */
var BODY_FRAMES = [
  "안녕하세요, {name}입니다.\n\n{msg}\n\n{issue} 이 사안에 대해 강한 항의의 뜻을 전합니다.\n건설적인 답변을 기다리겠습니다.\n\n{name} 드림",
  "담당자님, 안녕하세요.\n{name}이라고 합니다.\n\n{issue}에 대해 항의하고 싶어 메일을 드립니다.\n제가 전하고 싶은 말은 이렇습니다:\n\n{msg}\n\n신중한 검토와 답변을 부탁드립니다.\n\n{name} 올림",
  "안녕하세요.\n\n{msg}\n\n이런 이유로 {issue} 문제를 두고 깊은 유감을 표합니다.\n{name}입니다. 소비자·시민으로서 정당한 답변을 요청합니다.\n\n{name} 드림",
  "담당 부서에 전해주시길 바랍니다.\n\n{name}입니다. {issue} 사안으로 항의합니다.\n\n{msg}\n\n이 사안이 어떻게 처리되는지 지켜보겠습니다.\n답변 부탁드립니다.\n\n{name} 올림",
  "안녕하세요, {name}입니다.\n\n{issue}에 대해 이 메일로 강하게 항의합니다.\n\n제 한마디를 먼저 전합니다.\n\n{msg}\n\n성실한 회신을 요청드립니다.\n\n{name} 드림"
];

var ISSUE = "이번 사안"; /* 실제 항의 이슈 한 줄로 교체 */

/* ── 유틸 ──────────────────────────────────────────────────── */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shorten(s, n){ s = s.trim().replace(/\s+/g," "); return s.length > n ? s.slice(0,n-1)+"…" : s; }
function fill(t, name, msg){ return t.replace(/\{name\}/g, name).replace(/\{msg-s\}/g, shorten(msg,14)).replace(/\{msg\}/g, msg).replace(/\{issue\}/g, ISSUE); }
function mailtoLink(email, subj, body){
  return "mailto:" + email
    + "?subject=" + encodeURIComponent(subj)
    + "&body=" + encodeURIComponent(body.replace(/\n/g,"\r\n"));
}

/* ── 상태 (메모리만) ───────────────────────────────────────── */
var userName = "", userMsg = "";

function buildDest(){
  var list = document.getElementById("destlist");
  // label 유지, 기존 .dest 제거
  var olds = list.querySelectorAll(".dest"); olds.forEach(function(x){ x.remove(); });
  DESTS.forEach(function(d, i){
    var row = document.createElement("div"); row.className = "dest";
    var info = document.createElement("div"); info.className = "dinfo";
    info.innerHTML = '<div class="dname"></div><div class="dmail"></div>';
    info.querySelector(".dname").textContent = d.name;
    info.querySelector(".dmail").textContent = d.email;
    var btn = document.createElement("button");
    btn.className = "send"; btn.textContent = "메일 쓰기";
    btn.addEventListener("click", function(){
      var subj = fill(pick(SUBJ_POOL), userName, userMsg);
      var body = fill(pick(BODY_FRAMES), userName, userMsg);
      var opened = false;
      try {
        // iOS Safari 등: 클릭 핸들러 안에서 즉시 이동
        window.location.href = mailtoLink(d.email, subj, body);
        opened = true;
      } catch(e){}
      if (opened){
        btn.textContent = "작성창 열림 ✓"; btn.classList.add("done");
      }
    });
    row.appendChild(info); row.appendChild(btn);
    list.appendChild(row);
  });
}

document.getElementById("go").addEventListener("click", function(){
  var n = document.getElementById("name").value.trim();
  var m = document.getElementById("msg").value.trim();
  if (!n){ alert("이름을 입력해 주세요."); return; }
  if (!m){ alert("한마디를 입력해 주세요."); return; }
  userName = n; userMsg = m;
  document.getElementById("hello").textContent = n;
  buildDest();
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
  window.scrollTo(0,0);
});

document.getElementById("back").addEventListener("click", function(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step1").classList.remove("hidden");
});
})();
</script>
</body>
</html>
